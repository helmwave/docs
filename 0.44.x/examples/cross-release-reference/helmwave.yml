project: "Example: cross-release reference"
version: ⟨⟨ ver ⟩⟩

repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

.options: &options
  namespace: my-namespace
  wait: watcher

releases:
  # redis is built first (no dependencies)
  - name: redis
    <<: *options
    chart: bitnami/redis
    store:
      port: 6379
    values:
      - values/redis.yml

  # backend depends on redis, so it's built after redis
  # backend's values can reference redis's built manifests and values
  - name: backend
    <<: *options
    chart: bitnami/nginx
    depends_on:
      - redis
    values:
      - values/backend.yml
